  fetch(url, { cache: 'no-store' })

      // Rewrite relative image paths to jsDelivr so assets load reliably

      html = html.replace(/(src|href)=(["'])images\//g, function(_, a, q){ return a + '=' + q + base + 'images/'; });

      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      document.body.innerHTML = '<div style="font-family:system-ui;padding:40px;max-width:480px;margin:auto">'
        + '<h1 style="color:#5A7350">Taj Handloom</h1>'
