<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Taj Handloom Dalli Rajhara</title>
<meta name="description" content="Taj Handloom — Dalli Rajhara trusted home store for 15+ years. Mattresses, razaai, curtains & more." />
<link rel="canonical" href="https://taj-handloom.vercel.app/" />
<style>html,body{margin:0;background:#FBF6EC;min-height:100%}</style>
</head>
<body>
<script>
(function(){
  var url = "https://cdn.jsdelivr.net/gh/knightriderisback/Taj-handloom@b2038121984fb3ccb6a39ebab43594d382111a05/index.html";
  var imgBase = "https://cdn.jsdelivr.net/gh/knightriderisback/Taj-handloom@b2038121984fb3ccb6a39ebab43594d382111a05/";
  fetch(url, {cache:"force-cache"})
    .then(function(r){ if(!r.ok) throw new Error("fail"); return r.text(); })
    .then(function(html){
      html = html.replace(/(src|href)=(["'])images\//g, function(_,a,q){ return a+"="+q+imgBase+"images/"; });
      html = html.replace(/Image_URL:(["'])images\//g, function(_,q){ return "Image_URL:"+q+imgBase+"images/"; });
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(){
      location.replace("https://raw.githack.com/knightriderisback/Taj-handloom/b2038121984fb3ccb6a39ebab43594d382111a05/index.html");
    });
})();
</script>
</body>
</html>
